<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../css/tokens.css">
<script src="../js/common.js"></script>
<style>
  .left { position: absolute; left: 14px; top: 48px; width: 300px; }
  .right { position: absolute; left: 328px; right: 12px; top: 48px; }
  .why { padding: 5px 8px; font-size: var(--fs-caption2); line-height: 14px; }
  .why .ln { display: flex; justify-content: space-between; }
  .why b { font-family: "Display"; font-weight: 600; font-size: 13px; }
  .sh { display: grid; grid-template-columns: 1fr 78px; gap: 0 8px; padding: 4px 0 5px; border-bottom: 1px solid var(--line); }
  .sh .n { font-size: var(--fs-caption); line-height: 15px; font-weight: 600; }
  .sh .w { font-size: var(--fs-caption2); line-height: 13px; color: var(--stone); }
  .sh .v { grid-row: span 3; text-align: right; }
  .sh .v .num { font-size: 22px; line-height: 22px; }
  .sh .v .b { font-size: var(--fs-caption2); line-height: 13px; }
  .foot { position: absolute; right: 12px; bottom: 4px; }
</style></head>
<body><div id="root"></div>
<script>
const pts = [["Pre", 60], ["1", 62], ["2", 58], ["3", 61], ["4", 57], ["5", 60], ["6", 67]];
const W = 300, H = 104, px = (i) => 14 + i * 38, py = (v) => 8 + (90 - v) * 1.34;
let svg = `<svg width="${W}" height="${H + 14}" style="display:block">`;
svg += `<rect x="0" y="${py(30)}" width="${W}" height="${py(20) - py(30)}" fill="rgba(244,124,114,0.10)"/>`;
svg += `<line x1="0" y1="${py(30)}" x2="${W}" y2="${py(30)}" stroke="rgba(244,124,114,0.6)" stroke-width="1" stroke-dasharray="3 2"/>`;
svg += `<text x="${W - 2}" y="${py(30) + 11}" text-anchor="end" font-family="Text" font-size="10" fill="var(--loss)">Hot seat below 30</text>`;
for (const v of [40, 50, 60, 70, 80]) svg += `<line x1="0" y1="${py(v)}" x2="${W}" y2="${py(v)}" stroke="var(--line)" stroke-width="1"/><text x="${W - 2}" y="${py(v) - 3}" text-anchor="end" font-family="Display" font-size="10" fill="var(--dim)">${v}</text>`;
svg += `<path d="${pts.map((p, i) => `${i ? "L" : "M"}${px(i)} ${py(p[1]).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--chalk)" stroke-width="1.8"/>`;
pts.forEach((p, i) => {
  svg += `<circle cx="${px(i)}" cy="${py(p[1])}" r="${i === 6 ? 3.5 : 2.2}" fill="var(--chalk)"/>`;
  svg += `<text x="${px(i)}" y="${H + 10}" text-anchor="middle" font-family="Display" font-weight="600" font-size="10" fill="var(--stone)">${p[0] === "Pre" ? "PRE" : "W" + p[0]}</text>`;
});
svg += `<line x1="${px(6)}" y1="${py(67)}" x2="${px(7)}" y2="${py(73)}" stroke="var(--chalk)" stroke-width="1.2" stroke-dasharray="2 2"/>`;
svg += `<circle cx="${px(7)}" cy="${py(73)}" r="3" fill="none" stroke="var(--chalk)" stroke-width="1.2"/><text x="${px(7)}" y="${py(73) - 6}" text-anchor="middle" font-family="Display" font-weight="600" font-size="10" fill="var(--stone)">73</text>`;
svg += `<text x="${px(7)}" y="${H + 10}" text-anchor="middle" font-family="Display" font-weight="600" font-size="10" fill="var(--dim)">TARGET</text></svg>`;

const sh = (name, who, v, band, trend, wants, last) => `<div class="sh">
  <div class="n">${name} <span class="stone" style="font-weight:400">&middot; ${who}</span></div>
  <div class="v"><div class="num ${trend === "up" ? "gain" : trend === "down" ? "loss" : ""}">${v}</div><div class="b stone">${band} ${trend === "up" ? "&#9650;" : trend === "down" ? "&#9660;" : ""}</div></div>
  <div class="w">Wants: ${wants}</div><div class="w">${last}</div></div>`;

document.getElementById("root").innerHTML = device(`
<div class="safe">
  ${rail("marlow", "program", ["recruit"])}
  <div class="content">
    <div class="hdr">
      <div style="display:flex;align-items:baseline;gap:12px"><span class="ttl">Job security</span>
        <span class="ctx">Measured against 6th in the Tri-River, set by AD Priscilla Vance</span></div>
      <div class="footnote stone" style="padding-right:12px">After Week 6</div>
    </div>

    <div class="left">
      <div style="display:flex;align-items:baseline;gap:10px">
        <span class="num" style="font-size:44px;line-height:44px">67</span>
        <span class="headline">Steady</span><span class="caption gain">&#9650; 7 this week</span></div>
      ${svg}
      <div class="panel why">
        <div class="ln"><span class="stone">Projected finish (expected 6th)</span><b class="fog">3rd&ndash;5th</b></div>
        <div class="ln"><span class="stone">Target: 50 + 10 per place better (6th &minus; 4th)</span><b>70</b></div>
        <div class="ln"><span class="stone">Locker room above 70</span><b class="gain">+3</b></div>
        <div class="ln"><span class="stone">Security moves halfway: 60 toward 73</span><b>67</b></div>
      </div>
    </div>

    <div class="right">
      <div class="sect"><span class="label">The people who decide</span></div>
      ${sh("AD Priscilla Vance", "athletic director", 67, "Steady", "up", "6th or better; attendance up", '"A road win at Sedalia. That\'s the job."')}
      ${sh("Boosters", "chair Hap Dorsey", 52, "Neutral", "down", "beat Ardmore Tech; NIL deals done", "You sent Kimbrough to the breakfast: &minus;2")}
      ${sh("Fans", "attendance 71%", 63, "Supportive", "up", "home wins and points", "Next: Hot Springs at home, Week 7")}
      ${sh("Locker room", "captains Brandt, Oyelaran", 72, "Supportive", "", "fair playing time; a lighter week", "You backed Brandt in the press: +4")}
      <div class="caption2 dim" style="margin-top:4px">A group at 70 or above adds 3 to the target; one below 40 takes 5 away.</div>
    </div>

    <div class="foot"><div class="continue"><span class="k">Continue</span><span class="v">Week 7 vs Hot Springs</span></div></div>
  </div>
</div>`);
</script>
</body></html>
