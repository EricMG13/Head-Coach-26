<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../css/tokens.css">
<script src="../js/common.js"></script>
<style>
  .top { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: flex-end; justify-content: space-between; padding: 9px 0 7px; border-bottom: 1px solid var(--line); }
  .offers { position: absolute; left: 0; right: 0; top: 50px; bottom: 4px; display: flex; gap: 10px; }
  .offer { flex: 1; border-radius: var(--r-panel); background: var(--surface); overflow: hidden; display: flex; flex-direction: column; }
  .band { height: 5px; }
  .head { display: flex; gap: 8px; align-items: center; padding: 7px 10px 6px; border-bottom: 1px solid var(--line); }
  .rows { padding: 2px 10px; flex: 1; }
  .rw { padding: 2px 0 2px; border-bottom: 1px solid var(--line); }
  .rw .k { font-family: "Display"; font-weight: 600; font-size: 11px; line-height: 13px; letter-spacing: 0.08em; color: var(--stone); text-transform: uppercase; }
  .rw .v { font-size: var(--fs-caption); line-height: 15px; white-space: nowrap; }
  .rw.exp .v { font-weight: 600; }
  .quote { padding: 4px 10px 0; font-size: var(--fs-caption2); line-height: 13px; }
  .take { margin: 6px 10px 8px; min-height: 36px; }
</style></head>
<body><div id="root"></div>
<script>
const offer = (club, place, arch, rows, ad, quote) => {
  const c = CLUBS[club];
  return `<div class="offer"><div class="band" style="background:${c.primary}"></div>
    <div class="head">${shield(club, 28, 31)}<div><div class="headline" style="line-height:19px">${c.name}</div>
      <div class="caption stone">${c.nick} &middot; ${place}</div><div class="caption2 dim">${arch}</div></div></div>
    <div class="rows">${rows.map((r) => Array.isArray(r[0])
      ? `<div class="rw" style="display:flex;gap:10px">${r.map(([k, v]) => `<div style="flex:1"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}</div>`
      : `<div class="rw ${r[2] || ""}"><div class="k">${r[0]}</div><div class="v">${r[1]}</div></div>`).join("")}</div>
    <div class="quote"><span class="semibold">${ad}:</span> <span class="stone">"${quote}"</span></div>
    <div class="btn btn-quiet take">Take the job</div></div>`;
};
document.getElementById("root").innerHTML = device(`
<div class="safe">
  <div class="top">
    <div style="display:flex;align-items:center;gap:10px;padding-left:2px"><i class="pennant"></i><span class="ttl" style="font-family:Display;font-weight:700;font-size:24px;line-height:24px;letter-spacing:.03em;text-transform:uppercase">Three programs want to talk</span></div>
    <div class="footnote stone">Coach Jordan Hale &middot; wide zone, 4-2-5 quarters</div>
  </div>
  <div class="offers">
    ${offer("marlow", "Marlow, OK", "Regional riser", [
      ["Conference &middot; prestige", "Tri-River (12) &middot; 52, 64th of 134"],
      ["Your AD expects", '<span class="flag-c">6th</span> in the Tri-River', "exp"],
      ["The catch", "Thin line: 2 starters return"],
      [["Scheme fit", "14 of 22"], ["NIL pot", "$2,400,000"]],
      ["Contract", "4 years at $1,850,000"]],
      "AD Priscilla Vance", "We have been a .500 program for ten years. Show me a plan.")}
    ${offer("amarillo", "Amarillo, TX", "Commuter school", [
      ["Conference &middot; prestige", "Llano (12) &middot; 31, 112th of 134"],
      ["Your AD expects", '<span class="flag-c">8th</span> in the Llano', "exp"],
      ["The catch", "Recruits within 200 miles only"],
      [["Scheme fit", "9 of 22"], ["NIL pot", "$900,000"]],
      ["Contract", "5 years at $1,050,000"]],
      "AD Ron Beckett", "Nobody expects anything here. That is the opportunity.")}
    ${offer("staubin", "Little Rock, AR", "Private academic", [
      ["Conference &middot; prestige", "Tri-River (12) &middot; 58, 49th of 134"],
      ["Your AD expects", '<span class="flag-c">4th</span> in the Tri-River', "exp"],
      ["The catch", "Recruits need a 3.2 GPA"],
      [["Scheme fit", "17 of 22"], ["NIL pot", "$3,100,000"]],
      ["Contract", "3 years at $2,300,000"]],
      "AD Diane Whitlow", "We win the right way, and we win now.")}
  </div>
</div>`);
</script>
</body></html>
