<!doctype html>
<html><head><meta charset="utf-8">
<meta name="canvas" content="1400 940 2">
<link rel="stylesheet" href="../css/tokens.css">
<script src="../js/common.js"></script>
<script src="../js/field.js"></script>
<style>
  body { background: var(--ground); }
  .sheet { position: relative; width: 1400px; height: 940px; padding: 28px 32px; background: var(--ground); }
  h1 { font-family: "Display"; font-weight: 700; font-size: 34px; line-height: 36px; letter-spacing: 0.03em; text-transform: uppercase; }
  .rules { display: flex; gap: 22px; margin-top: 6px; font-size: 14px; color: var(--stone); }
  .rules b { color: var(--chalk); }
  .cols { display: grid; grid-template-columns: 400px 420px 1fr; gap: 32px; margin-top: 20px; }
  .h { font-family: "Display"; font-weight: 600; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--stone); margin: 14px 0 8px; display: flex; gap: 8px; align-items: center; }
  .h::after { content: ""; flex: 1; height: 6px; background: repeating-linear-gradient(90deg, var(--line-strong) 0 1px, transparent 1px 6px); }
  .h:first-child { margin-top: 0; }
  .sw { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .chipc { border-radius: 6px; height: 44px; box-shadow: inset 0 0 0 1px var(--line); display: flex; align-items: flex-end; padding: 4px 6px; font-family: "Display"; font-weight: 600; font-size: 12px; }
  .swl { font-size: 11px; line-height: 13px; margin-top: 3px; color: var(--stone); }
  .swl b { color: var(--chalk); font-weight: 600; }
  .ts { display: grid; grid-template-columns: 90px 1fr 52px 52px; gap: 2px 10px; align-items: baseline; font-size: 12px; }
  .ts .hd { font-family: "Display"; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--stone); font-size: 11px; }
  .blocks { display: flex; gap: 10px; align-items: flex-end; }
  .blocks div { background: var(--fog); opacity: .75; }
  .comp { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .cell { padding: 10px; border-radius: 8px; background: var(--surface); }
  .cap { font-size: 11px; line-height: 14px; color: var(--stone); margin-top: 6px; }
  .clubs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 4px; }
  .club { padding: 10px; border-radius: 8px; background: var(--surface); display: flex; gap: 10px; align-items: flex-start; }
</style></head>
<body><div id="root"></div>
<script>
function lum(h) { const c = [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255).map((v) => (v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4)); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; }
function cr(a, b) { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return ((x + 0.05) / (y + 0.05)).toFixed(1); }
const T = { ground: "#0C1210", surface: "#141C18", raised: "#1B2520", line: "#2A3631", lineStrong: "#3B4A43", chalk: "#EEF1EA", stone: "#A9B5AE", dim: "#8A978F", flag: "#F4C542", ink: "#14120A", gain: "#5CC98C", loss: "#F47C72", fog: "#8DB8E2", turf: "#1C4A2D" };
const sw = (name, hex, text, note) => `<div><div class="chipc" style="background:${hex};color:${text || "var(--chalk)"}">${name}</div><div class="swl"><b>${hex}</b>${note ? "<br>" + note : ""}</div></div>`;
const vs = (hex) => `${Math.min(cr(hex, T.ground), cr(hex, T.surface), cr(hex, T.raised))}:1 worst`;
const club = (k) => {
  const c = CLUBS[k];
  const marks = `<svg width="64" height="30" style="display:block;border-radius:4px"><rect width="64" height="30" fill="${T.turf}"/>
    <circle cx="18" cy="15" r="6" fill="${c.primary}" stroke="${c.ring}" stroke-width="2"/>
    <polygon points="${[[-7.5,0],[5.8,-6.8],[2.3,0],[5.8,6.8]].map(([a,b])=>`${46+a},${15+b}`).join(" ")}" fill="${c.primary}" stroke="${c.ring}" stroke-width="2" stroke-linejoin="round"/></svg>`;
  return `<div class="club"><div style="width:4px;align-self:stretch;border-radius:2px;background:${c.primary}"></div>${shield(k, 30, 34)}
    <div style="flex:1"><div style="font-weight:600;font-size:13px">${c.name} ${c.nick}</div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:6px">
        <div style="background:${c.primary};color:${c.plateText};font-family:Display;font-weight:700;font-size:15px;letter-spacing:.07em;padding:3px 8px;border-radius:4px">${c.short} 24</div>${marks}</div>
      <div class="cap">Plate text ${cr(c.plateText, c.primary)}:1 &middot; mark ring on turf ${cr(c.ring, T.turf)}:1</div></div></div>`;
};
const opt = `<div style="position:relative;padding:6px 8px;border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--flag);background:rgba(244,197,66,0.06)">
  <span style="position:absolute;right:8px;top:-7px;font-family:Display;font-weight:600;font-size:10.5px;line-height:12px;letter-spacing:.08em;padding:0 5px;border-radius:3px;background:var(--surface);color:var(--flag);box-shadow:inset 0 0 0 1px var(--flag)">RECOMMENDED</span>
  <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-weight:600;font-size:13px">Go: Stick to Lund</span><span style="font-family:Display;font-weight:600;font-size:16px;color:var(--fog)"><span style="font-family:Text;font-size:10.5px;font-weight:500">converts </span>58&ndash;67%</span></div>
  <div style="font-size:12px;line-height:15px;color:var(--stone)"><b style="color:var(--chalk)">Tries</b> the ball out before #54 gets home.</div>
  <div style="font-size:12px;line-height:15px;color:var(--stone)"><b style="color:var(--chalk)">Risks</b> Hollis jumps it: their ball.</div></div>`;

document.getElementById("root").innerHTML = `<div class="sheet">
  <h1>Chalkline <span class="stone" style="font-weight:600">&middot; the visual language of Head Coach, v0</span></h1>
  <div class="rules"><span><b>Night field, chalk lines.</b> Dark ground, thin chalk rules, hash marks for headers.</span>
    <span><b>Yellow is yours to decide.</b> And the line to gain. Nothing else is yellow.</span>
    <span><b>Blue is an estimate.</b> Always a range, never a point.</span>
    <span><b>Club colours stay in their places.</b></span></div>
  <div class="cols">
    <div>
      <div class="h">Palette &middot; worst contrast on ground, surface, raised</div>
      <div class="sw">${sw("ground", T.ground)}${sw("surface", T.surface)}${sw("raised", T.raised)}${sw("line", T.line)}${sw("line strong", T.lineStrong)}</div>
      <div class="sw" style="margin-top:10px">${sw("chalk", T.chalk, T.ink, "facts &middot; " + vs(T.chalk))}${sw("stone", T.stone, T.ink, "secondary &middot; " + vs(T.stone))}${sw("dim", T.dim, T.ink, "unavailable &middot; " + vs(T.dim))}${sw("turf", T.turf, T.chalk, "field only")}${sw("ink", T.ink, T.chalk, "on flag " + cr(T.ink, T.flag) + ":1")}</div>
      <div class="sw" style="margin-top:10px">${sw("flag", T.flag, T.ink, "your decision &middot; " + vs(T.flag))}${sw("gain", T.gain, T.ink, "better &middot; " + vs(T.gain))}${sw("loss", T.loss, T.ink, "worse &middot; " + vs(T.loss))}${sw("fog", T.fog, T.ink, "estimate &middot; " + vs(T.fog))}<div></div></div>
      <div class="cap" style="margin-top:8px">Every text colour passes 4.5:1 on every surface it can sit on. Gain and loss always come with a sign, an arrow or a word, never colour alone. Increase Contrast swaps stone and dim for chalk.</div>
      <div class="h">Spacing and radii</div>
      <div class="blocks">${[4, 8, 12, 16, 24, 32].map((v) => `<div style="width:${v}px;height:${v}px"></div>`).join("")}
        <span class="cap" style="margin:0 0 0 8px">4-point grid: 4, 8, 12, 16, 24, 32</span></div>
      <div class="blocks" style="margin-top:10px">${[3, 6, 8, 12].map((r) => `<div style="width:34px;height:24px;border-radius:${r}px;opacity:1;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line-strong)"></div>`).join("")}
        <span class="cap" style="margin:0 0 0 8px">Radii: chip 3, control 6, panel 8, sheet 12. Touch targets 44 &times; 44.</span></div>
    </div>

    <div>
      <div class="h">Type</div>
      <div style="display:flex;gap:18px;align-items:baseline">
        <span style="font-family:Display;font-weight:700;font-size:44px;line-height:44px">4TH &amp; 2</span>
        <span style="font-family:Display;font-weight:700;font-size:28px">27&ndash;24</span>
        <span class="label" style="font-size:15px">This week</span></div>
      <div class="cap" style="margin-bottom:10px">Display: Barlow Condensed (SIL Open Font License, ships in the app) for numbers that matter, screen titles and caps labels. Scales with Dynamic Type relative to its text style.</div>
      <div class="ts">
        <span class="hd">Style</span><span class="hd">Text: SF Pro (Inter stands in here)</span><span class="hd">Large</span><span class="hd">AX5</span>
        <span class="stone">Headline</span><span style="font-size:17px;font-weight:600">Who starts at running back?</span><span class="num">17</span><span class="num">53</span>
        <span class="stone">Body</span><span style="font-size:17px">Onboarding and long text</span><span class="num">17</span><span class="num">53</span>
        <span class="stone">Subhead</span><span style="font-size:15px">Buttons</span><span class="num">15</span><span class="num">49</span>
        <span class="stone">Footnote</span><span style="font-size:13px">Option names, status lines</span><span class="num">13</span><span class="num">44</span>
        <span class="stone">Caption</span><span style="font-size:12px">Tables, details, the caption strip</span><span class="num">12</span><span class="num">43</span>
        <span class="stone">Caption 2</span><span style="font-size:11px">Secondary lines, the smallest text</span><span class="num">11</span><span class="num">40</span>
      </div>
      <div class="cap">Numbers use tabular figures so columns line up. Player-facing copy is short, plain and US English.</div>
      <div class="h">Estimates and facts</div>
      <div style="display:grid;grid-template-columns:110px 1fr 60px;gap:8px 10px;align-items:center;font-size:12px">
        <span class="stone">Your evaluation</span>${rangeBar(74, 84)}<span class="num fog" style="font-size:15px">74&ndash;84</span>
        <span class="stone">Potential</span>${rangeBar(80, 92)}<span class="num fog" style="font-size:15px">80&ndash;92</span>
        <span class="stone">Pass pro (known)</span>${ratingBar(74)}<span class="num" style="font-size:15px">74</span>
      </div>
      <div class="cap">A range narrows as evidence arrives: evaluations, film hours, seasons played. Your own players' current ratings are facts; their potential is not.</div>
      <div class="h">Motion</div>
      <div class="cap" style="margin-top:0">Snaps you called play in full (about 5 s); others condense (about 1.8 s). A call-in panel slides in over 0.2 s. Reduce Motion: marks cross-fade to their recorded positions and nothing slides.</div>
    </div>

    <div>
      <div class="h">Components</div>
      <div class="comp">
        <div class="cell"><div class="continue" style="display:inline-flex"><span class="k">Continue</span><span class="v">Inbox: 2 to answer</span></div>
          <div class="cap">Always bottom right. Names the next obligation.</div></div>
        <div class="cell"><div style="display:flex;gap:8px;align-items:center"><i class="pennant"></i><span style="font-size:13px;font-weight:600">Who starts at running back?</span></div>
          <div style="margin-top:6px"><span class="chip chip-flag" style="font-family:Display;font-size:12px;letter-spacing:.08em">YOUR CALL</span></div>
          <div class="cap">The pennant marks a decision that is yours.</div></div>
        <div class="cell" style="grid-column:span 2">${opt}<div class="cap">A call-in option: what it tries, what it risks, the coordinator's estimate as a range.</div></div>
        <div class="cell"><span class="seg"><span>Cautious</span><span class="on">By the numbers</span><span>Aggressive</span></span>
          <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><span class="chip chip-gain">Worked</span><span class="chip chip-loss">Didn't</span><span class="chip chip-loss">Hot</span><span class="chip chip-line">Fair</span></div></div>
        <div class="cell"><div style="display:flex;gap:8px;align-items:center"><div class="btn btn-quiet btn-sm" style="color:var(--dim)">Cruise to kickoff</div></div>
          <div class="cap">Unavailable controls stay visible and say why: "Answer or delegate the inbox first."</div></div>
        <div class="cell" style="grid-column:span 2;display:flex;gap:14px;align-items:center">
          <svg width="150" height="44" style="border-radius:4px;flex:none"><rect width="150" height="44" fill="${T.turf}"/>
            <line x1="62" y1="0" x2="62" y2="44" stroke="rgba(238,241,234,.9)" stroke-width="1.3"/><line x1="80" y1="0" x2="80" y2="44" stroke="#F4C542" stroke-width="2"/>
            <circle cx="40" cy="22" r="5" fill="${CLUBS.marlow.primary}" stroke="${CLUBS.marlow.ring}" stroke-width="1.6"/>
            <circle cx="40" cy="22" r="9" fill="none" stroke="#EEF1EA" stroke-width="1"/>
            <circle cx="52" cy="12" r="5" fill="${CLUBS.marlow.primary}" stroke="${CLUBS.marlow.ring}" stroke-width="1.6" opacity=".62"/>
            <polygon points="${[[-6,0],[4.6,-5.4],[1.8,0],[4.6,5.4]].map(([a,b])=>`${100+a},${22+b}`).join(" ")}" fill="${CLUBS.sedalia.primary}" stroke="${CLUBS.sedalia.ring}" stroke-width="1.5" stroke-linejoin="round"/>
            <polygon points="${[[-6,0],[4.6,-5.4],[1.8,0],[4.6,5.4]].map(([a,b])=>`${120+a},${32+b}`).join(" ")}" fill="${CLUBS.sedalia.primary}" stroke="${CLUBS.sedalia.ring}" stroke-width="1.5" stroke-linejoin="round" opacity=".62"/>
            <path d="M44 22 L72 22" stroke="#F4C542" stroke-width="1.6" stroke-dasharray="3 2"/></svg>
          <div class="cap" style="margin:0">Offense is a disc, defense a chevron pointing at the line: shape carries the role, colour carries the club. A ring marks one of at most four emphasised marks; the rest dim. White line: scrimmage. Yellow: the line to gain.</div></div>
      </div>
    </div>
  </div>
  <div class="h" style="margin-top:18px">Club colours: the stripe, the monogram, the plate, the marks. Nowhere else.</div>
  <div class="clubs">${club("marlow")}${club("sedalia")}${club("staubin")}${club("hartford")}</div>
  <div class="cap">Generated pairs are checked at generation, never repaired afterwards: plate text at least 4.5:1, a mark's ring on turf at least 3:1. If the secondary colour fails on turf, the ring uses the primary or chalk.</div>
</div>`;
</script>
</body></html>
